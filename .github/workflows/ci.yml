# Checks that need neither a GPU nor the private test data. The UI tests and anything that
# renders on the GPU stay local; see HANDOFF.md for the full test command.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal --component rustfmt,clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - name: Format
        run: cargo fmt -p pictor-engine -p pictor -- --check
      - name: Vendored sources
        run: python3 tools/verify_sources.py
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Engine tests
        run: cargo test --locked --release -p pictor-engine
      - name: Design tokens test
        run: cargo test --locked --release -p pictor --test tokens

  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - name: Compile check
        run: cargo check --workspace --all-targets --locked
