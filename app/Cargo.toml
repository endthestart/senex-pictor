[package]
name = "pictor"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"
description = "Pictor, the SENEX nightscape stacker: the app and its command-line tools (ADR 0011)"

[dependencies]
bytemuck = { version = "1", features = ["derive"] }
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "wgpu", "accesskit", "persistence"] }
egui = "0.36"
half = "2.7"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
pollster = "1"
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pictor-engine = { path = ".." }
wgpu = { version = "30", default-features = false, features = ["std", "parking_lot", "metal", "vulkan", "dx12", "wgsl"] }

[target.'cfg(target_os = "macos")'.dependencies]
mimalloc = { version = "0.1", default-features = false }
muda = { version = "0.21", default-features = false }

[dev-dependencies]
egui_kittest = { version = "0.36", features = ["wgpu", "eframe"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
